# =============================================================================
# _quarto.yml: site configuration (navigation, theme, global options)
# -----------------------------------------------------------------------------
# To add a page: create the .qmd file and add it to `navbar` below.
#   popgen/         R package: ALL population genetics (runs in the browser via webR)
#   js/             webR bridge + charts (JavaScript, drawing only)
#   config/         Explorer presets (JSON)
#   _partials/      code shared by the pages (starts R)
#   styles/         site look (SCSS)
# See docs/DEVELOPER_GUIDE.md for details.
# =============================================================================

project:
  type: website
  output-dir: _site
  # Only these files become pages. README, docs/ etc. are for maintainers.
  render:
    - "*.qmd"
    - "konzepte/*.qmd"
  # Files that pages load at runtime must be copied to the site as-is.
  resources:
    - js/
    - config/
    - popgen/R/

lang: de

website:
  title: "Populationsgenetik"
  description: "Interaktive Simulationen zu Hardy-Weinberg, Drift, Selektion, Mutation, Migration und Inzucht. Begleitmaterial zu Bio 113, Universität Zürich."
  site-url: "https://wdomi.github.io/bio113_lk_dashboard/"
  repo-url: "https://github.com/wdomi/bio113_lk_dashboard"
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Start
      - text: Konzepte
        menu:
          - konzepte/hardy-weinberg.qmd
          - konzepte/drift.qmd
          - konzepte/selektion.qmd
          - konzepte/mutation.qmd
          - konzepte/migration.qmd
          - konzepte/inzucht.qmd
          - konzepte/flaschenhals.qmd
      - href: explorer.qmd
        text: Explorer
      - href: glossar.qmd
        text: Glossar
    right:
      - href: ueber.qmd
        text: Über
  page-footer:
    center: "Bio 113 · Universität Zürich · [Quellcode](https://github.com/wdomi/bio113_lk_dashboard)"

format:
  html:
    theme: [flatly, styles/custom.scss]
    toc: false
    html-math-method: katex
    code-fold: true
    code-summary: "Code anzeigen"
    # Students see controls and plots, not the code behind them.
    echo: false

execute:
  freeze: auto
