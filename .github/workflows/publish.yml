# =============================================================================
# publish.yml — build the Quarto site and publish it on GitHub Pages
# -----------------------------------------------------------------------------
# Runs on every push to `main` (and can be started by hand under
# Actions → "Publish site" → Run workflow).
#
# One-time setup in the repository on GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The site then appears at https://wdomi.github.io/bio113_lk_dashboard/
# =============================================================================
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same tests as check.yml: never publish a broken model.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R test packages
        run: Rscript -e 'install.packages(c("testthat", "pkgload", "jsonlite"))'
      - name: R tests (popgen package)
        run: Rscript -e 'testthat::test_local("popgen", stop_on_failure = TRUE)'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Node tests (webR bridge)
        run: npm test

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
