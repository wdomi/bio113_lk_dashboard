# =============================================================================
# check.yml — run tests and a test render on every pull request
# -----------------------------------------------------------------------------
# Nothing is published here. A red cross on a pull request means: the tests
# failed or the site does not render. Click "Details" to see the log.
# =============================================================================
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the simulation engine
        run: npm test
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        run: quarto render
