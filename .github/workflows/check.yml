# =============================================================================
# check.yml: run all tests and a test render on every pull request
# -----------------------------------------------------------------------------
# Nothing is published here. A red cross on a pull request means: a test
# failed or the site does not render. Click "Details" to see the log.
#   - R tests (testthat):   the population genetics in popgen/
#   - Node tests:           the bridge that runs popgen/ in the browser (webR)
# =============================================================================
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R test packages
        run: Rscript -e 'install.packages(c("testthat", "pkgload", "jsonlite"))'
      - name: R tests (popgen package)
        run: Rscript -e 'testthat::test_local("popgen", stop_on_failure = TRUE)'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Node tests (webR bridge, runs the R package through webR)
        run: npm test

      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        run: quarto render
